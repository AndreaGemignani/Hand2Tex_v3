name: Tests with PDF compilation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the production PDF compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test including real PDF compilation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q
      - name: Render synthetic document for visual review
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m scripts.preview_document --emit-preview
