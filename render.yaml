services:
  - type: web
    name: hand2tex-v2
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TRUSTEDROUTER_API_KEY
        sync: false
      - key: TRUSTEDROUTER_BASE_URL
        value: https://api.trustedrouter.com/v1
      - key: QWEN_OCR_MODEL
        value: qwen/qwen-vl-ocr
      - key: QWEN_RESCUE_MODEL
        value: qwen/qwen3.8-max
      - key: TRUSTEDROUTER_SORT
        value: price
      - key: ENABLE_QWEN_RESCUE
        value: "true"
      - key: LAYOUT_BACKEND
        value: qwen
      - key: MISTRAL_API_KEY
        sync: false
      - key: ENABLE_MISTRAL_LAYOUT_RESCUE
        value: "false"
      - key: TYPESAFE_API_KEY
        sync: false
      - key: JEV_ENABLED
        value: "false"
      - key: MAX_PAGES
        value: "30"
      - key: MAX_UPLOAD_MB
        value: "30"
